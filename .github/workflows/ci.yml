name: CI - Test & Build

on:
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: church_bot
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d church_bot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli -a ci-redis-password ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
        env:
          REDIS_ARGS: "--requirepass ci-redis-password"
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/church_bot
      REDIS_URL: redis://localhost:6379
      WHATSAPP_PROVIDER: stub
      ENABLE_SCHEDULER: false
      BOT_ADMIN_API_KEY: ci-admin-key
      VITE_ADMIN_PASSWORD: ci-admin-key
      VITE_RUM_ENABLED: true
      VITE_RUM_ENDPOINT: /fgc-testing/api/observability/rum

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Security audit
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Check env parity
        run: npm run env:parity

      - name: Ensure bot schema
        run: npm run bot:schema:ensure

      - name: Run unit tests
        run: npm run test:unit

      - name: Run integration tests
        run: npm run test:integration

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Run security smoke checks
        run: npm run qa:security

      - name: Run performance smoke checks
        run: npm run qa:performance

      - name: Run load checks
        run: npm run qa:load -- 25

      - name: Build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68cf7e19c5e1a39abb82b34 # v4.6.0
        with:
          name: build-preview
          path: dist/
          retention-days: 3
